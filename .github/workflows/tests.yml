name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Check for Python syntax errors
        run: |
          python -m py_compile server.py seed_data.py seed_guards.py seed_sites.py migrate.py fix_db.py

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Playwright's Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run test suite
        run: pytest tests/ -v
